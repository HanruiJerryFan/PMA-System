spring.application.name=salesmanagement
spring.datasource.url=jdbc:mysql://localhost:3306/salesmanagement
spring.datasource.username=root
spring.datasource.password=1031
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.jerry.salesmanagement.pojo

server.port=8081
server.address=localhost
server.forward-headers-strategy=framework
server.servlet.session.timeout = 900
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2MB
server.tomcat.max-swallow-size=100MB
server.tomcat.max-http-form-post-size=100MB
app.attachment.storage-root=uploads
app.pdf.font-path=
app.scheduling.enabled=true
app.auth.self-registration-enabled=false
app.security.trust-forward-headers=false
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
app.ai.enabled=false
app.ai.provider=openai-compatible
app.ai.base-url=
app.ai.api-key=
app.ai.model=
app.ai.timeout-seconds=45
app.ai.mask-sensitive-names=true
